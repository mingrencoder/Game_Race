<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《跑跑赛车》后端测试控制台</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00f2ff;
            --success-color: #00ff00;
            --error-color: #ff2222;
            --border-color: #333;
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h1, h2, h3 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            background-color: var(--error-color);
            color: white;
        }
        
        .status-badge.logged-in {
            background-color: var(--success-color);
            color: black;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .module {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 8px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: #333;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background-color: var(--accent-color);
            color: black;
        }

        .log-container {
            flex: 1;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-y: auto;
            padding: 15px;
            margin-top: 10px;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }

        .log-entry {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #333;
        }

        .log-time {
            color: #888;
            font-size: 12px;
        }

        .log-api {
            color: var(--accent-color);
            font-weight: bold;
        }
        
        .user-info {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>《跑跑赛车》联调控制台</h1>
            <div id="userInfoDisplay" class="user-info"></div>
        </div>
        <div>
            <span id="authStatus" class="status-badge">未登录</span>
            <button id="logoutBtn" style="display: none; margin-left: 10px;" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="main-content">
        <div class="left-panel">
            
            <div class="module">
                <h2>模块一：账号系统测试</h2>
                
                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1;">
                        <h3>注册</h3>
                        <div class="form-group">
                            <label>昵称 (Nickname)</label>
                            <input type="text" id="regUsername" placeholder="只允许英文数字">
                        </div>
                        <div class="form-group">
                            <label>密码 (Password)</label>
                            <input type="password" id="regPassword" placeholder="输入密码">
                        </div>
                        <button onclick="handleRegister()">一键注册</button>
                    </div>

                    <div style="flex: 1; border-left: 1px solid var(--border-color); padding-left: 20px;">
                        <h3>登录</h3>
                        <div class="form-group">
                            <label>账号 / 昵称</label>
                            <input type="text" id="loginUsername" placeholder="输入账号或昵称">
                        </div>
                        <div class="form-group">
                            <label>密码 (Password)</label>
                            <input type="password" id="loginPassword" placeholder="输入密码">
                        </div>
                        <button onclick="handleLogin()">一键登录</button>
                    </div>
                </div>
            </div>

            <div class="module">
                <h2>模块二：GM 强改测试 (需要 Admin 账号登录)</h2>
                <p style="color: #888; font-size: 14px; margin-bottom: 15px;">
                    测试说明：用 admin / pop1993 登录后，可对指定玩家存档进行强制篡改。
                </p>
                <div class="form-group">
                    <label>目标玩家 UID (8位数字)</label>
                    <input type="text" id="gmTargetUid" placeholder="例如: 10000001">
                </div>
                <div class="form-group">
                    <label>目标车辆 ID</label>
                    <input type="text" id="gmVehicleId" value="car_basic" placeholder="车辆ID，默认为 car_basic (新星-V1)">
                </div>
                <button onclick="handleGMOverride()" style="width: 100%; margin-bottom: 10px;">⚡ 执行车库一键强改 (Level 5 + T3配件)</button>
                <button onclick="handleGMGrantResources()" style="width: 100%;">💰 一键发放初始资金与材料 (10w金币+全材料卡片)</button>
            </div>

            <div class="module">
                <h2>模块三：核心经济与玩法测试</h2>
                
                <div class="form-group">
                    <label>使用的赛车ID用于跑赛</label>
                    <input type="text" id="raceCarId" value="car_basic" placeholder="车辆ID，默认 car_basic">
                </div>
                
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button onclick="handlePlaySingle()" style="flex: 1;">🏁 跑一局单人赛 (第1名)</button>
                    <button onclick="handleBuyT1Car()" style="flex: 1;">🛒 购买一辆 T1 赛车 (30金币)</button>
                </div>
                
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button onclick="handleBuyPart()" style="flex: 1;">🛒 买配件 (engine_t1, 10金币)</button>
                    <button onclick="handleEquipPart()" style="flex: 1;">🔧 装配配件 (engine_t1 到 engine槽)</button>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button onclick="handleUpgradeCar()" style="flex: 1;">⚙️ 强化一次赛车 (消耗核心)</button>
                </div>
            </div>

        </div>

        <div class="right-panel">
            <h2>服务器日志面板</h2>
            <div class="log-container" id="logContainer">
                <!-- Logs will appear here -->
            </div>
            <button onclick="document.getElementById('logContainer').innerHTML = ''" style="margin-top: 10px; width: 100%;">清空日志</button>
        </div>
    </div>

    <script>
        // 配置
        const API_BASE = 'http://localhost:3000/api';
        let jwtToken = localStorage.getItem('paopao_jwt') || null;
        let currentUser = JSON.parse(localStorage.getItem('paopao_user') || 'null');

        // 初始化
        updateAuthUI();

        function updateAuthUI() {
            const statusEl = document.getElementById('authStatus');
            const logoutBtn = document.getElementById('logoutBtn');
            const userInfoDisplay = document.getElementById('userInfoDisplay');

            if (jwtToken && currentUser) {
                statusEl.textContent = '已获取 Token';
                statusEl.className = 'status-badge logged-in';
                logoutBtn.style.display = 'inline-block';
                userInfoDisplay.innerHTML = `当前UID: <b>${currentUser.uid}</b> | 角色: <b>${currentUser.role}</b>`;
            } else {
                statusEl.textContent = '未登录';
                statusEl.className = 'status-badge';
                logoutBtn.style.display = 'none';
                userInfoDisplay.innerHTML = '';
            }
        }

        function logout() {
            jwtToken = null;
            currentUser = null;
            localStorage.removeItem('paopao_jwt');
            localStorage.removeItem('paopao_user');
            updateAuthUI();
            log('系统', '已退出登录并清除本地 Token。');
        }

        function log(apiName, data, isError = false) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            const time = new Date().toLocaleTimeString();
            const color = isError ? 'var(--error-color)' : 'var(--success-color)';

            const dataStr = typeof data === 'string' ? data : JSON.stringify(data, null, 2);

            entry.innerHTML = `
                <div class="log-time">[${time}] <span class="log-api" style="color: ${color}">${apiName}</span></div>
                <pre style="color: ${isError ? '#ffaaaa' : '#e0e0e0'}">${dataStr}</pre>
            `;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight; // Auto scroll to bottom
        }

        async function fetchAPI(endpoint, method, body = null) {
            const url = `${API_BASE}${endpoint}`;
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            if (jwtToken) {
                options.headers['Authorization'] = `Bearer ${jwtToken}`;
            }

            if (body) {
                options.body = JSON.stringify(body);
            }

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                
                if (!response.ok) {
                    log(`${method} ${endpoint}`, data, true);
                    return null;
                }
                
                log(`${method} ${endpoint}`, data);
                return data;
            } catch (error) {
                log(`${method} ${endpoint}`, `Network/Fetch Error: ${error.message}`, true);
                return null;
            }
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            
            if (!username || !password) {
                alert('请输入昵称和密码');
                return;
            }

            log('Client', `正在注册账号... (${username})`);
            await fetchAPI('/auth/register', 'POST', { username, password });
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!username || !password) {
                alert('请输入账号/昵称和密码');
                return;
            }

            log('Client', `正在登录... (${username})`);
            const res = await fetchAPI('/auth/login', 'POST', { username, password });
            
            if (res && res.success && res.token) {
                jwtToken = res.token;
                currentUser = res.user;
                localStorage.setItem('paopao_jwt', jwtToken);
                localStorage.setItem('paopao_user', JSON.stringify(currentUser));
                updateAuthUI();
                
                // 登录如果为 admin自动填充目标uid测试用
                if(currentUser.role === 'admin') {
                     document.getElementById('gmTargetUid').value = '10000001';
                } else {
                     document.getElementById('gmTargetUid').value = currentUser.uid;
                }
            }
        }

        async function handleGMOverride() {
            const targetUid = document.getElementById('gmTargetUid').value.trim();
            const vehicleId = document.getElementById('gmVehicleId').value.trim() || 'car_basic';

            if (!targetUid) {
                alert('请输入目标玩家 UID');
                return;
            }

            log('Client', `正在执行 GM 强改... 目标UID: ${targetUid}, 车辆: ${vehicleId}`);
            await fetchAPI('/gm/overrideGarage', 'POST', { targetUid, vehicleId });
        }

        async function handleGMGrantResources() {
            const targetUid = document.getElementById('gmTargetUid').value.trim();

            if (!targetUid) {
                alert('请输入目标玩家 UID');
                return;
            }

            log('Client', `正在执行 GM 资源发放... 目标UID: ${targetUid}`);
            await fetchAPI('/gm/grantResources', 'POST', { targetUid });
        }

        async function handlePlaySingle() {
            const carId = document.getElementById('raceCarId').value.trim() || 'car_basic';
            log('Client', `跑跑赛车结算中... 模式: 单人, 车辆: ${carId}, 名次: 1`);
            await fetchAPI('/economy/calculate', 'POST', { 
                mode: 'single', 
                carId: carId, 
                rank: 1, 
                players: 1, 
                difficulty: 1 
            });
        }

        async function handleBuyT1Car() {
            log('Client', `尝试购买 T1 赛车... 花费: 30`);
            await fetchAPI('/shop/buyCar', 'POST', { 
                carId: 'car_t1_base', 
                isPermanent: false, 
                cost: 30 
            });
        }

        async function handleBuyPart() {
            log('Client', `尝试购买 engine_t1 配件...`);
            await fetchAPI('/shop/buyPart', 'POST', { 
                partId: 'engine_t1', 
                cost: 10 
            });
        }

        async function handleEquipPart() {
            const carId = document.getElementById('raceCarId').value.trim() || 'car_basic';
            log('Client', `尝试给 ${carId} 装配 engine_t1 ...`);
            await fetchAPI('/shop/equipPart', 'POST', { 
                carId: carId,
                slotId: 'engine',
                partId: 'engine_t1'
            });
        }

        async function handleUpgradeCar() {
            const carId = document.getElementById('raceCarId').value.trim() || 'car_basic';
            log('Client', `请求尝试强化赛车: ${carId} (若无材料会报错)`);
            await fetchAPI('/upgrade/car', 'POST', { 
                carId: carId, 
                useProtectionCard: false 
            });
        }

    </script>
</body>
</html>
